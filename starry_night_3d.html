  gl.bindTexture(gl.TEXTURE_2D, reflTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, REFL_W, REFL_H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  const reflDepth = gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER, reflDepth);
  gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, REFL_W, REFL_H);

  const reflFBO = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, reflFBO);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, reflTex, 0);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, reflDepth);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  // =========================================================================
  // 9. Physics Engine (Rapier3D WASM with Seamless Built-in Fallback)
  // =========================================================================
  const player = {
    x: bridges[1].x - bridges[1].tx * 18,
    y: 0,
    z: bridges[1].z - bridges[1].tz * 18,
    vx: 0, vy: 0, vz: 0,
    yaw: Math.atan2(bridges[1].tx, bridges[1].tz),
    speed: 0,
    grounded: true,
    pathS: ((bridges[1].s - 18) + totalPathLen) % totalPathLen,
    gaitPhase: 0,
    jumpTimer: 0,
    lanternAngleX: 0, lanternVelX: 0,
    lanternAngleZ: 0, lanternVelZ: 0,
    lanternPos: [0, 0, 0]
  };
  player.y = getRideableHeight(player.x, player.z);

  let physicsMode = 'builtin';
  let rapierWorld = null;
  let rapierBody = null;
  let rapierCtrl = null;
  let rapierCollider = null;
  let RAPIER_REF = null;

  async function initPhysics() {
    if (forceBuiltinPhysics) {
      statPhysics.textContent = '內建物理';
      return;
    }
    try {
      setLoadProgress(84, '正在載入 Rapier3D 物理引擎…');
      const loadPromise = import('https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/rapier.es.js');
      const timeoutPromise = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 4500));
      const mod = await Promise.race([loadPromise, timeoutPromise]);
      const RAPIER = mod.default || mod;
      await RAPIER.init();
      RAPIER_REF = RAPIER;

      rapierWorld = new RAPIER.World({ x: 0, y: -24.0, z: 0 });

      // Build terrain heightfield collider (128x128 grid over [-160, 160])
      const nr = 128, nc = 128;
      const hfSpan = 320.0;
      const heights = new Float32Array((nr + 1) * (nc + 1));
      for (let col = 0; col <= nc; col++) {
        const x = ((col / nc) - 0.5) * hfSpan;
        for (let row = 0; row <= nr; row++) {
          const z = ((row / nr) - 0.5) * hfSpan;
          heights[col * (nr + 1) + row] = getRideableHeight(x, z);
        }
      }
      const hfDesc = RAPIER.ColliderDesc.heightfield(nr, nc, heights, { x: hfSpan, y: 1.0, z: hfSpan });
      rapierWorld.createCollider(hfDesc);

      // Obstacle colliders (fences, stone walls, fallen logs)
      for (const ob of obstacles) {
        const qy = Math.sin(ob.yaw * 0.5), qw = Math.cos(ob.yaw * 0.5);
        const colDesc = RAPIER.ColliderDesc.cuboid(ob.halfWidth, ob.height * 0.5, ob.halfDepth)
          .setTranslation(ob.x, ob.y + ob.height * 0.5, ob.z)
          .setRotation({ x: 0, y: qy, z: 0, w: qw });
        rapierWorld.createCollider(colDesc);
      }

      // Solid building colliders
      const buildingBox = (bx, bz, hx, hy, hz, yaw = 0) => {
        const by = getRawTerrainHeight(bx, bz);
        const qy = Math.sin(yaw * 0.5), qw = Math.cos(yaw * 0.5);
        rapierWorld.createCollider(
          RAPIER.ColliderDesc.cuboid(hx, hy, hz)
            .setTranslation(bx, by + hy, bz)
            .setRotation({ x: 0, y: qy, z: 0, w: qw })
        );
      };
      buildingBox(COTTAGE_POS.x, COTTAGE_POS.z, 3.2, 2.5, 2.5, 0.48);
      buildingBox(WINDMILL_POS.x, WINDMILL_POS.z, 3.3, 5.0, 3.3, 0);
      buildingBox(CHURCH_POS.x, CHURCH_POS.z, 4.0, 6.0, 6.2, 0.15);
      for (const vh of VILLAGE_HOUSES) buildingBox(vh.x, vh.z, vh.w * 0.5, vh.h * 0.5, vh.d * 0.5, vh.yaw);

      // Kinematic horse rider capsule + CharacterController
      const bodyDesc = RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(player.x, player.y + 0.95, player.z);
      rapierBody = rapierWorld.createRigidBody(bodyDesc);
      rapierCollider = rapierWorld.createCollider(RAPIER.ColliderDesc.capsule(0.45, 0.50), rapierBody);
      rapierCtrl = rapierWorld.createCharacterController(0.08);
      rapierCtrl.setMaxSlopeClimbAngle(52 * Math.PI / 180);
      rapierCtrl.setMinSlopeSlideAngle(55 * Math.PI / 180);
      rapierCtrl.enableSnapToGround(0.35);

      physicsMode = 'rapier';
      statPhysics.textContent = 'Rapier3D 物理';
    } catch (err) {
      console.warn('Rapier failed to load, falling back to built-in physics:', err);
      physicsMode = 'builtin';
      statPhysics.textContent = '內建物理';
    }
  }

  function stepPhysics(dt, moveDirX, moveDirZ, targetSpeed, wantJump) {
    const accel = 16.0;
    player.vx = mix(player.vx, moveDirX * targetSpeed, clamp(dt * accel, 0, 1));
    player.vz = mix(player.vz, moveDirZ * targetSpeed, clamp(dt * accel, 0, 1));

    if (wantJump && player.grounded) {
      player.vy = 10.6;
      player.grounded = false;
      player.jumpTimer = 0.01;
    }
    player.vy -= 24.0 * dt;

    if (physicsMode === 'rapier' && rapierCtrl && rapierBody) {
      if (player.vy > 0.05 || !player.grounded) {
        rapierCtrl.disableSnapToGround();
      } else {
        rapierCtrl.enableSnapToGround(0.35);
      }
      const desired = { x: player.vx * dt, y: player.vy * dt, z: player.vz * dt };
      rapierCtrl.computeColliderMovement(rapierCollider, desired);
      const corr = rapierCtrl.computedMovement();
      const pos = rapierBody.translation();
      const nx = clamp(pos.x + corr.x, -148, 148);
      const ny = pos.y + corr.y;
      const nz = clamp(pos.z + corr.z, -148, 148);
      rapierBody.setNextKinematicTranslation({ x: nx, y: ny, z: nz });
      rapierWorld.step();

      player.x = nx;
      player.z = nz;
      const exactGround = getRideableHeight(player.x, player.z);
      const footY = ny - 0.95;
      if (player.vy <= 0.1 && rapierCtrl.computedGrounded()) {
        player.grounded = true;
        player.vy = 0;
        player.y = Math.max(footY, exactGround);
      } else if (footY <= exactGround + 0.02 && player.vy <= 0) {
        player.grounded = true;
        player.vy = 0;
        player.y = exactGround;
        rapierBody.setNextKinematicTranslation({ x: player.x, y: exactGround + 0.95, z: player.z });
      } else {
        player.grounded = false;
        player.y = footY;
      }
    } else {
      // Built-in fallback physics
      let nx = clamp(player.x + player.vx * dt, -148, 148);
      let nz = clamp(player.z + player.vz * dt, -148, 148);
      let ny = player.y + player.vy * dt;

      // Obstacle AABB/OBB collision (can jump cleanly over!)
      const horseRad = 0.58;
      for (const ob of obstacles) {
        const dx = nx - ob.x, dz = nz - ob.z;
        const c = Math.cos(-ob.yaw), s = Math.sin(-ob.yaw);
        const lx = dx * c + dz * s;
        const lz = -dx * s + dz * c;
        const ex = ob.halfWidth + horseRad, ez = ob.halfDepth + horseRad;
        if (Math.abs(lx) < ex && Math.abs(lz) < ez) {
          const topY = ob.y + ob.height;
          if (ny >= topY - 0.18) {
            // Land on or clear above obstacle
            if (ny < topY && player.vy <= 0) { ny = topY; player.vy = 0; player.grounded = true; }
          } else {
            // Push horizontally out of obstacle
            const penX = ex - Math.abs(lx);
            const penZ = ez - Math.abs(lz);
            let plx = lx, plz = lz;
            if (penX < penZ) plx = Math.sign(lx || 1) * ex;
            else plz = Math.sign(lz || 1) * ez;
            const cw = Math.cos(ob.yaw), sw = Math.sin(ob.yaw);
            nx = ob.x + plx * cw + plz * sw;
            nz = ob.z - plx * sw + plz * cw;
          }
        }
      }

      // Building cylinder push-out
      const pushCircle = (bx, bz, rad) => {
        const dx = nx - bx, dz = nz - bz;
        const d = Math.hypot(dx, dz);
        if (d < rad && d > 1e-4) {
          nx = bx + (dx / d) * rad;
          nz = bz + (dz / d) * rad;
        }
      };
      pushCircle(COTTAGE_POS.x, COTTAGE_POS.z, 4.2);
      pushCircle(WINDMILL_POS.x, WINDMILL_POS.z, 4.0);
      pushCircle(CHURCH_POS.x, CHURCH_POS.z, 6.2);
      for (const vh of VILLAGE_HOUSES) pushCircle(vh.x, vh.z, 3.6);

      // Keep out of deep river unless on bridge or jumping
      const gY = getRideableHeight(nx, nz);
      if (ny <= gY) {
        ny = gY;
        player.vy = 0;
        player.grounded = true;
      } else {
        player.grounded = false;
      }

      player.x = nx; player.y = ny; player.z = nz;
    }

    // Prevent sinking into deep river water if player walks off bridge
    if (getBridgeAt(player.x, player.z) === null && player.y < WATER_Y - 0.25) {
      player.y = WATER_Y - 0.25;
      if (player.vy < 0) player.vy = 0;
      player.grounded = true;
    }

    player.speed = Math.hypot(player.vx, player.vz);
    if (player.speed > 0.25) {
      const targetYaw = Math.atan2(player.vx, player.vz);
      let diff = targetYaw - player.yaw;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      player.yaw += diff * clamp(dt * 8.5, 0, 1);
    }
    if (!player.grounded) player.jumpTimer += dt;
    else player.jumpTimer = 0;
  }

  // =========================================================================
  // 10. Articulated Horse, Saddle, Reins, Knight, Cloak, Hat & Lantern Builder
  // =========================================================================
  function buildHeroStrokes(time) {
    let idx = 0;
    const pushHero = (wx, wy, wz, len, nx, ny, nz, wid, tx, ty, tz, matType, colL, colS, emissive = 0) => {
      if (idx >= HERO_CAP) return;
      const i4 = idx * 4;
      heroBatch.posLen[i4] = wx; heroBatch.posLen[i4+1] = wy; heroBatch.posLen[i4+2] = wz; heroBatch.posLen[i4+3] = len;
      const nl = Math.hypot(nx, ny, nz) || 1;
      heroBatch.normWid[i4] = nx/nl; heroBatch.normWid[i4+1] = ny/nl; heroBatch.normWid[i4+2] = nz/nl; heroBatch.normWid[i4+3] = wid;
      const tl = Math.hypot(tx, ty, tz) || 1;
      heroBatch.tanMeta[i4] = tx/tl; heroBatch.tanMeta[i4+1] = ty/tl; heroBatch.tanMeta[i4+2] = tz/tl;
      heroBatch.tanMeta[i4+3] = matType + HERO_SEEDS[idx];
      heroBatch.colLit[i4] = clamp((colL[0]*255)|0, 0, 255);
      heroBatch.colLit[i4+1] = clamp((colL[1]*255)|0, 0, 255);
      heroBatch.colLit[i4+2] = clamp((colL[2]*255)|0, 0, 255);
      heroBatch.colLit[i4+3] = clamp((emissive*255)|0, 0, 255);
      heroBatch.colShd[i4] = clamp((colS[0]*255)|0, 0, 255);
      heroBatch.colShd[i4+1] = clamp((colS[1]*255)|0, 0, 255);
      heroBatch.colShd[i4+2] = clamp((colS[2]*255)|0, 0, 255);
      heroBatch.colShd[i4+3] = 185;
      idx++;
    };

    const sp = player.speed;
    const isGallop = sp > 10.5;
    const isMove = sp > 0.35;
    const strideFreq = isGallop ? 10.5 : (isMove ? 5.8 : 1.5);
    const amp = !player.grounded ? 0.65 : (isGallop ? 0.85 : (isMove ? 0.50 : 0.03));

    const bodyBob = !player.grounded ? 0.06 : Math.sin(player.gaitPhase * 2.0) * (isGallop ? 0.11 : (isMove ? 0.05 : 0.015));
    const bodyPitch = !player.grounded ? clamp(-player.vy * 0.04, -0.35, 0.35)
                    : Math.cos(player.gaitPhase * 2.0) * (isGallop ? 0.12 : 0.02);

    const cy = Math.cos(player.yaw), sy = Math.sin(player.yaw);
    const cp = Math.cos(bodyPitch), spP = Math.sin(bodyPitch);

    // Local horse space -> world space transform
    const toWorld = (lx, ly, lz) => {
      // Pitch around X, then yaw around Y
      const py = ly * cp - lz * spP;
      const pz = ly * spP + lz * cp;
      return [
        player.x + lx * cy + pz * sy,
        player.y + 1.02 + bodyBob + py,
        player.z - lx * sy + pz * cy
      ];
    };
    const dirToWorld = (lx, ly, lz) => {
      const py = ly * cp - lz * spP;
      const pz = ly * spP + lz * cp;
      return [lx * cy + pz * sy, py, -lx * sy + pz * cy];
    };

    // Palettes
    const horseL = [0.54, 0.30, 0.15], horseS = [0.22, 0.11, 0.06];
    const maneL  = [0.16, 0.10, 0.07], maneS  = [0.06, 0.04, 0.04];
    const sadL   = [0.34, 0.16, 0.09], sadS   = [0.14, 0.07, 0.05];
    const cloakL = [0.16, 0.36, 0.78], cloakS = [0.06, 0.14, 0.36];
    const hatL   = [0.18, 0.22, 0.34], hatS   = [0.07, 0.09, 0.16];
    const skinL  = [0.78, 0.60, 0.46], skinS  = [0.36, 0.25, 0.20];

    // Helper: stroked capsule limb between local points A and B
    const drawLimb = (ax, ay, az, bx, by, bz, rA, rB, nRings, nRingPts, colL, colS, strokeLen = 0.22, strokeWid = 0.11) => {
      const dx = bx - ax, dy = by - ay, dz = bz - az;
      const len = Math.hypot(dx, dy, dz) || 1;
      const tx = dx/len, ty = dy/len, tz = dz/len;
      const ref = Math.abs(ty) < 0.9 ? [0, 1, 0] : [1, 0, 0];
      const ux = ref[1]*tz - ref[2]*ty, uy = ref[2]*tx - ref[0]*tz, uz = ref[0]*ty - ref[1]*tx;
      const ul = Math.hypot(ux, uy, uz) || 1;
      const u = [ux/ul, uy/ul, uz/ul];
      const v = cross3([tx, ty, tz], u);
      for (let ri = 0; ri < nRings; ri++) {
        const t = (ri + 0.5) / nRings;
        const r = mix(rA, rB, t);
        const cx = mix(ax, bx, t), cy0 = mix(ay, by, t), cz = mix(az, bz, t);
        for (let pi = 0; pi < nRingPts; pi++) {
          const ang = (pi / nRingPts) * Math.PI * 2 + ri * 0.5;
          const ca = Math.cos(ang), sa = Math.sin(ang);
          const lnx = u[0]*ca + v[0]*sa, lny = u[1]*ca + v[1]*sa, lnz = u[2]*ca + v[2]*sa;
          const wp = toWorld(cx + lnx*r, cy0 + lny*r, cz + lnz*r);
          const wn = dirToWorld(lnx, lny, lnz);
          const wt = dirToWorld(tx, ty, tz);
          pushHero(wp[0], wp[1], wp[2], strokeLen, wn[0], wn[1], wn[2], strokeWid, wt[0], wt[1], wt[2], 1, colL, colS);
        }
      }
    };

    // 1. Horse Torso, Chest & Hindquarters
    drawLimb(0, -0.02, -0.68, 0, 0.04, 0.65, 0.34, 0.36, 14, 14, horseL, horseS, 0.32, 0.16);
    // Chest & rump spherical caps
    drawLimb(0, -0.05, 0.55, 0, 0.08, 0.85, 0.34, 0.24, 5, 10, horseL, horseS, 0.28, 0.14);
    drawLimb(0, -0.05, -0.58, 0, -0.08, -0.84, 0.33, 0.20, 5, 10, horseL, horseS, 0.28, 0.14);

    // 2. Horse Neck, Head, Ears & Flowing Mane
    const headBob = Math.sin(player.gaitPhase + 0.5) * (isMove ? 0.06 : 0.02);
    const neckTop = [0, 0.68 + headBob, 1.05];
    drawLimb(0, 0.16, 0.62, neckTop[0], neckTop[1], neckTop[2], 0.24, 0.15, 7, 10, horseL, horseS, 0.26, 0.13);
    // Head + Muzzle
    const muzzle = [0, 0.42 + headBob, 1.48];
    drawLimb(neckTop[0], neckTop[1] + 0.05, neckTop[2] - 0.04, muzzle[0], muzzle[1], muzzle[2], 0.16, 0.09, 6, 9, horseL, horseS, 0.22, 0.11);
    // Ears
    for (const sgn of [-1, 1]) {
      drawLimb(sgn*0.08, neckTop[1]+0.12, neckTop[2]+0.02, sgn*0.10, neckTop[1]+0.28, neckTop[2]+0.04, 0.04, 0.015, 2, 4, horseL, horseS, 0.14, 0.06);
    }
    // Mane along neck crest
    for (let m = 0; m < 10; m++) {
      const mt = m / 9;
      const mx = Math.sin(time * 4 + m) * 0.03 + 0.04;
      const my = mix(0.30, neckTop[1] + 0.14, mt);
      const mz = mix(0.60, neckTop[2] - 0.05, mt);
      const wp = toWorld(mx, my, mz);
      const wt = dirToWorld(0.2, 0.2, -1.0);
      pushHero(wp[0], wp[1], wp[2], 0.26, 1, 0.4, 0, 0.09, wt[0], wt[1], wt[2], 1, maneL, maneS);
    }

    // 3. Flowing Tail
    for (let t = 0; t < 8; t++) {
      const tf = t / 7;
      const swing = Math.sin(time * (isMove ? 6.5 : 2.2) - tf * 1.6) * (0.08 + sp * 0.012);
      const wp = toWorld(swing, 0.02 - tf * 0.58, -0.84 - tf * (0.28 + sp * 0.025));
      const wt = dirToWorld(swing*0.5, -0.85, -0.45);
      pushHero(wp[0], wp[1], wp[2], 0.24, 0, 0.3, -1, 0.09, wt[0], wt[1], wt[2], 1, maneL, maneS);
    }

    // 4. Four Articulated Legs (4-beat gallop vs diagonal trot vs jump pose)
    const legConfigs = [
      { x:  0.19, z:  0.54, phase: 0.0,                           front: true  }, // FL
      { x: -0.19, z:  0.54, phase: isGallop ? 1.45 : Math.PI,     front: true  }, // FR
      { x:  0.19, z: -0.58, phase: isGallop ? 3.45 : Math.PI,     front: false }, // BL
      { x: -0.19, z: -0.58, phase: isGallop ? 4.60 : 0.0,         front: false }  // BR
    ];
    for (const lg of legConfigs) {
      const ph = player.gaitPhase + lg.phase;
      let hipAng, kneeAng;
      if (!player.grounded) {
        // Graceful jump pose: forelegs tuck, hind legs sweep back/up
        const jUp = clamp(player.vy * 0.09, -0.6, 0.8);
        hipAng  = lg.front ? (0.55 + jUp * 0.5) : (-0.65 + jUp * 0.3);
        kneeAng = lg.front ? (-1.25 - Math.max(0, jUp) * 0.4) : (0.55);
      } else {
        hipAng = Math.sin(ph) * amp;
        const swing = Math.max(0, Math.cos(ph));
        kneeAng = lg.front ? (-swing * amp * 1.35) : (swing * amp * 1.15);
      }
      const hip = [lg.x, -0.18, lg.z];
      const L1 = 0.44, L2 = 0.44;
      const knee = [
        hip[0],
        hip[1] - Math.cos(hipAng) * L1,
        hip[2] + Math.sin(hipAng) * L1
      ];
      const lowerAng = hipAng + kneeAng;
      const hoof = [
        knee[0],
        knee[1] - Math.cos(lowerAng) * L2,
        knee[2] + Math.sin(lowerAng) * L2
      ];
      drawLimb(hip[0], hip[1], hip[2], knee[0], knee[1], knee[2], 0.11, 0.075, 4, 6, horseL, horseS, 0.22, 0.09);
      drawLimb(knee[0], knee[1], knee[2], hoof[0], hoof[1], hoof[2], 0.072, 0.055, 4, 6, horseL, horseS, 0.22, 0.08);
      drawLimb(hoof[0], hoof[1]+0.04, hoof[2], hoof[0], hoof[1]-0.05, hoof[2]+0.03, 0.065, 0.072, 2, 5, maneL, maneS, 0.12, 0.08);
    }

    // 5. Saddle & Stirrups
    drawLimb(0, 0.34, -0.22, 0, 0.30, 0.22, 0.30, 0.29, 4, 8, sadL, sadS, 0.24, 0.14);
    // Saddle pommel & cantle
    drawLimb(-0.20, 0.42, -0.24, 0.20, 0.42, -0.24, 0.07, 0.07, 3, 5, sadL, sadS, 0.16, 0.09);
    drawLimb(-0.18, 0.40,  0.24, 0.18, 0.40,  0.24, 0.07, 0.07, 3, 5, sadL, sadS, 0.16, 0.09);

    // 6. Knight Torso, Legs, Wide-Brimmed Hat
    const lean = isGallop ? 0.24 : (isMove ? 0.10 : 0.03);
    const pelvis = [0, 0.42, -0.02];
    const chest  = [0, 0.96, -0.02 + lean * 0.45];
    const headC  = [0, 1.24,  0.02 + lean * 0.55];

    // Rider legs gripping saddle
    for (const sgn of [-1, 1]) {
      drawLimb(sgn*0.20, 0.42, 0.02, sgn*0.32, 0.08, 0.14, 0.10, 0.08, 3, 5, cloakL, cloakS, 0.20, 0.10);
      drawLimb(sgn*0.32, 0.08, 0.14, sgn*0.32, -0.24, 0.04, 0.075, 0.065, 3, 5, sadL, sadS, 0.20, 0.09);
    }
    // Torso
    drawLimb(pelvis[0], pelvis[1], pelvis[2], chest[0], chest[1], chest[2], 0.19, 0.22, 6, 8, cloakL, cloakS, 0.24, 0.12);
    // Head
    drawLimb(chest[0], chest[1]+0.08, chest[2], headC[0], headC[1]+0.10, headC[2], 0.11, 0.11, 3, 6, skinL, skinS, 0.16, 0.09);

    // Wide-Brimmed Hat (crown + wide circular brim)
    const hatBase = [headC[0], headC[1] + 0.11, headC[2]];
    drawLimb(hatBase[0], hatBase[1], hatBase[2], hatBase[0], hatBase[1]+0.15, hatBase[2]-0.01, 0.14, 0.10, 3, 8, hatL, hatS, 0.14, 0.08);
    for (const ringR of [0.22, 0.35]) {
      const nBrim = 24;
      for (let b = 0; b < nBrim; b++) {
        const a = (b / nBrim) * Math.PI * 2;
        const wp = toWorld(hatBase[0] + Math.cos(a)*ringR, hatBase[1] - 0.01, hatBase[2] + Math.sin(a)*ringR);
        const wn = dirToWorld(Math.cos(a)*0.12, 0.99, Math.sin(a)*0.12);
        const wt = dirToWorld(-Math.sin(a), 0, Math.cos(a));
        pushHero(wp[0], wp[1], wp[2], 0.18, wn[0], wn[1], wn[2], 0.16, wt[0], wt[1], wt[2], 1, hatL, hatS);
      }
    }

    // 7. Dynamically Billowing Blue Cloak
    const cloakRows = 9, cloakCols = 8;
    const billow = clamp(sp * 0.055, 0.08, 0.78);
    for (let r = 0; r < cloakRows; r++) {
      const rt = r / (cloakRows - 1);
      for (let cIdx = 0; cIdx < cloakCols; cIdx++) {
        const ct = (cIdx / (cloakCols - 1)) - 0.5;
        const w = mix(0.42, 0.88, rt);
        const flutter = Math.sin(time * (4.0 + sp * 0.45) - rt * 3.8 + ct * 3.0) * (0.04 + rt * 0.12);
        const lx = ct * w;
        const ly = mix(chest[1] + 0.02, 0.10 + billow * 0.35, rt) + flutter;
        const lz = mix(chest[2] - 0.16, -0.78 - billow * 0.95, rt) + Math.abs(ct) * 0.08;
        const wp = toWorld(lx, ly, lz);
        const wn = dirToWorld(ct * 0.4, 0.65, -0.65);
        const wt = dirToWorld(0.1*ct, -0.65, -0.75);
        pushHero(wp[0], wp[1], wp[2], 0.24, wn[0], wn[1], wn[2], 0.16, wt[0], wt[1], wt[2], 1, cloakL, cloakS);
      }
    }

    // 8. Left Arm holding Reins + Right Arm holding Swinging Lantern
    const lHand = [0.22, 0.70, 0.36];
    drawLimb(0.22, chest[1], chest[2], lHand[0], lHand[1], lHand[2], 0.075, 0.055, 4, 5, cloakL, cloakS, 0.18, 0.08);

    // Reins connecting horse bridle (near muzzle) to rider's left hand!
    for (const sgn of [-1, 1]) {
      const bridle = [sgn * 0.11, muzzle[1] + 0.05, muzzle[2] - 0.12];
      const nRein = 7;
      for (let ri = 0; ri < nRein; ri++) {
        const t = ri / (nRein - 1);
        const sag = Math.sin(t * Math.PI) * 0.10;
        const rx = mix(bridle[0], lHand[0] - sgn * 0.03, t);
        const ry = mix(bridle[1], lHand[1], t) - sag;
        const rz = mix(bridle[2], lHand[2], t);
        const wp = toWorld(rx, ry, rz);
        const wt = dirToWorld(lHand[0]-bridle[0], lHand[1]-bridle[1], lHand[2]-bridle[2]);
        pushHero(wp[0], wp[1], wp[2], 0.18, 0, 1, 0, 0.035, wt[0], wt[1], wt[2], 1, sadL, sadS);
      }
    }

    // Right arm extended forward-right + swinging lantern
    const rHand = [-0.36, 0.94, 0.46];
    drawLimb(-0.22, chest[1], chest[2], rHand[0], rHand[1], rHand[2], 0.075, 0.055, 4, 5, cloakL, cloakS, 0.18, 0.08);
    // Hanging lantern pendulum in world space
    const handW = toWorld(rHand[0], rHand[1], rHand[2]);
    const ropeLen = 0.42;
    const lxOff = Math.sin(player.lanternAngleX) * ropeLen;
    const lzOff = Math.sin(player.lanternAngleZ) * ropeLen;
    const lyOff = -Math.sqrt(Math.max(0.05, ropeLen*ropeLen - lxOff*lxOff - lzOff*lzOff));
    const lanW = [handW[0] + lxOff, handW[1] + lyOff, handW[2] + lzOff];
    player.lanternPos = lanW;

    // Lantern handle chain
    for (let k = 0; k < 3; k++) {
      const t = (k + 0.5) / 3;
      pushHero(mix(handW[0], lanW[0], t), mix(handW[1], lanW[1] + 0.15, t), mix(handW[2], lanW[2], t), 0.12, 0, 0, 1, 0.03, 0, 1, 0, 1, [0.35, 0.28, 0.18], [0.15, 0.12, 0.10]);
    }
    // Glowing golden lantern core + brass frame (matType 8 = crisp world emissive)
    for (let k = 0; k < 14; k++) {
      const a = (k / 14) * Math.PI * 2;
      const yOff = ((k % 3) - 1) * 0.038;
      pushHero(lanW[0] + Math.cos(a)*0.08, lanW[1] + yOff, lanW[2] + Math.sin(a)*0.08, 0.16, Math.cos(a), 0, Math.sin(a), 0.11, 0, 1, 0, 8, [1.0, 0.88, 0.42], [1.0, 0.62, 0.14], 1.0);
    }
    // Lantern top/bottom caps
    pushHero(lanW[0], lanW[1] + 0.13, lanW[2], 0.20, 0, 1, 0, 0.16, 1, 0, 0, 1, [0.35, 0.25, 0.14], [0.14, 0.10, 0.08]);
    pushHero(lanW[0], lanW[1] - 0.13, lanW[2], 0.18, 0, -1, 0, 0.15, 1, 0, 0, 1, [0.35, 0.25, 0.14], [0.14, 0.10, 0.08]);

    heroBatch.count = idx;
    heroBatch.updateDynamic(heroGPU);
  }

  // =========================================================================
  // 11. Camera, Controls (Desktop + Mobile Joystick/Pinch), Auto-Ride & Tour
  // =========================================================================
  let autoRide = true;
  let tourMode = false;
  let tourTime = 0;

  const cam = {
    yaw: player.yaw + 0.45,
    pitch: 0.04,
    dist: 10.8,
    pos: [0, 5, 0],
    target: [player.x, player.y + 2.35, player.z]
  };

  // Input state
  const keys = Object.create(null);
  let joyVecX = 0, joyVecY = 0; // [-1, 1]
  let joySprint = false;
  let touchJumpQueued = false;

  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (e.code === 'KeyT') toggleTour();
    if (['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) {
      if (autoRide) setAutoRide(false);
    }
    if (e.code === 'Space') e.preventDefault();
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });

  // Desktop Mouse Orbit + Wheel Zoom
  let draggingMouse = false, lastMX = 0, lastMY = 0;
  canvas.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    draggingMouse = true;
    lastMX = e.clientX; lastMY = e.clientY;
  });
  window.addEventListener('mousemove', (e) => {
    if (!draggingMouse) return;
    const dx = e.clientX - lastMX, dy = e.clientY - lastMY;
    lastMX = e.clientX; lastMY = e.clientY;
    cam.yaw -= dx * 0.0055;
    cam.pitch = clamp(cam.pitch + dy * 0.0045, -0.35, 1.15);
  });
  window.addEventListener('mouseup', () => { draggingMouse = false; });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    cam.dist = clamp(cam.dist * (1 + e.deltaY * 0.001), 4.5, 42.0);
  }, { passive: false });

  // Mobile Virtual Joystick
  let joyTouchId = null;
  const JOY_MAX_R = 42;
  function updateJoy(clientX, clientY) {
    const rect = joystickZone.getBoundingClientRect();
    const cx = rect.left + rect.width * 0.5;
    const cy = rect.top + rect.height * 0.5;
    let dx = clientX - cx, dy = clientY - cy;
    const d = Math.hypot(dx, dy);
    if (d > JOY_MAX_R) { dx = dx / d * JOY_MAX_R; dy = dy / d * JOY_MAX_R; }
    joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    joyVecX = dx / JOY_MAX_R;
    joyVecY = dy / JOY_MAX_R;
    joySprint = (d / JOY_MAX_R) > 0.78;
    if (Math.hypot(joyVecX, joyVecY) > 0.12 && autoRide) setAutoRide(false);
  }
  joystickZone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    touchControls.classList.add('visible');
    const t = e.changedTouches[0];
    joyTouchId = t.identifier;
    updateJoy(t.clientX, t.clientY);
  }, { passive: false });
  window.addEventListener('touchmove', (e) => {
    if (joyTouchId === null) return;
    for (const t of e.changedTouches) {
      if (t.identifier === joyTouchId) { updateJoy(t.clientX, t.clientY); break; }
    }
  }, { passive: false });
  const endJoy = (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === joyTouchId) {
        joyTouchId = null;
        joyVecX = 0; joyVecY = 0; joySprint = false;
        joystickKnob.style.transform = 'translate(0px, 0px)';
      }
    }
  };
  window.addEventListener('touchend', endJoy);
  window.addEventListener('touchcancel', endJoy);

  btnJumpTouch.addEventListener('touchstart', (e) => {
    e.preventDefault();
    touchJumpQueued = true;
    btnJumpTouch.classList.add('pressed');
    if (autoRide) setAutoRide(false);
  }, { passive: false });
  btnJumpTouch.addEventListener('touchend', () => btnJumpTouch.classList.remove('pressed'));

  // Canvas Touch Orbit & Two-Finger Pinch Zoom
  const camTouches = new Map();
  let prevPinchDist = null;
  canvas.addEventListener('touchstart', (e) => {
    touchControls.classList.add('visible');
    for (const t of e.changedTouches) camTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
    if (camTouches.size === 2) {
      const pts = [...camTouches.values()];
      prevPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    }
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (camTouches.size === 1) {
      const t = e.changedTouches[0];
      const prev = camTouches.get(t.identifier);
      if (prev) {
        cam.yaw -= (t.clientX - prev.x) * 0.0065;
        cam.pitch = clamp(cam.pitch + (t.clientY - prev.y) * 0.005, -0.35, 1.15);
        prev.x = t.clientX; prev.y = t.clientY;
      }
    } else if (camTouches.size >= 2) {
      for (const t of e.changedTouches) {
        const entry = camTouches.get(t.identifier);
        if (entry) { entry.x = t.clientX; entry.y = t.clientY; }
      }
      const pts = [...camTouches.values()];
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (prevPinchDist !== null && d > 10) {
        cam.dist = clamp(cam.dist * (prevPinchDist / d), 4.5, 42.0);
      }
      prevPinchDist = d;
    }
  }, { passive: false });
  const endCamTouch = (e) => {
    for (const t of e.changedTouches) camTouches.delete(t.identifier);
    if (camTouches.size < 2) prevPinchDist = null;
  };
  canvas.addEventListener('touchend', endCamTouch);
  canvas.addEventListener('touchcancel', endCamTouch);

  // HUD Button Handlers
  function setAutoRide(v) {
    autoRide = v;
    btnAutoRide.classList.toggle('active', v);
    btnAutoRide.textContent = v ? '自動騎行：開' : '自動騎行：關';
  }
  function toggleTour() {
    tourMode = !tourMode;
    btnTour.classList.toggle('active', tourMode);
    btnTour.textContent = tourMode ? '全景巡遊：開' : '全景巡遊：關';
  }
  btnAutoRide.addEventListener('click', () => setAutoRide(!autoRide));
  btnTour.addEventListener('click', toggleTour);
  btnHelp.addEventListener('click', () => helpPanel.classList.toggle('open'));

  // Panoramic Tour Keyframes (Catmull-Rom spline around valley)
  const tourWaypoints = [
    { eye: [-18, 12, 74],   target: [0, 8, 15] },       // Over sunflowers looking at valley & swirls
    { eye: [-52, 18, -14],  target: [-82, 11, 10] },    // Waterfall & West Stone Bridge
    { eye: [-34, 24, -56],  target: [15, 20, -90] },    // Towering Hero Cypress framing starry sky
    { eye: [22, 17, -64],   target: [42, 10, -40] },    // Rotating Windmill & wheat field
    { eye: [70, 14, -42],   target: [96, 13, -16] },    // Village & tall Church Steeple
    { eye: [52, 8, 42],     target: [62, 3, 14] },      // East Stone Bridge & River reflections
    { eye: [0, 42, 95],     target: [5, 22, -40] }      // Grand panoramic vista of 3 mountain layers & moon
  ];
  function catmullRom(p0, p1, p2, p3, t) {
    const t2 = t * t, t3 = t2 * t;
    return [0, 1, 2].map(i => 0.5 * (
      (2 * p1[i]) + (-p0[i] + p2[i]) * t +
      (2*p0[i] - 5*p1[i] + 4*p2[i] - p3[i]) * t2 +
      (-p0[i] + 3*p1[i] - 3*p2[i] + p3[i]) * t3
    ));
  }

  // =========================================================================
  // 12. Adaptive Resolution Scaling & Main Render Loop
  // =========================================================================
  let renderScale = 1.0;
  let fpsAvg = 60.0;
  let frameCounter = 0;
  let fpsCheckTimer = 0;

  function resizeCanvas() {
    // Use actual physical device pixels (especially crucial on mobile!)
    const dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 3.0 : 2.0);
    const w = Math.max(320, Math.round(window.innerWidth * dpr * renderScale));
    const h = Math.max(200, Math.round(window.innerHeight * dpr * renderScale));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function drawSolidMesh(mesh, view, proj, isSky) {
    gl.useProgram(solidProg);
    gl.uniformMatrix4fv(gl.getUniformLocation(solidProg, 'uView'), false, view);
    gl.uniformMatrix4fv(gl.getUniformLocation(solidProg, 'uProj'), false, proj);
    gl.uniform3fv(gl.getUniformLocation(solidProg, 'uCamPos'), cam.pos);
    gl.uniform1i(gl.getUniformLocation(solidProg, 'uIsSky'), isSky ? 1 : 0);
    gl.bindVertexArray(mesh.vao);
    gl.drawArrays(gl.TRIANGLES, 0, mesh.vertCount);
  }

  // Cache uniform locations for strokeProg
  const uLoc = {};
  for (const name of [
    'uView','uProj','uModel','uUseModel','uCamPos','uViewport','uTime','uWaterY',
    'uIsGrass','uGrassSpan','uTerrainTex','uTerrainWorldSpan',
    'uMoonDir','uLanternPos','uWarmLights','uReflTex','uReflVP','uHasRefl'
  ]) {
    uLoc[name] = gl.getUniformLocation(strokeProg, name);
  }
  const warmLightsFlat = new Float32Array(8 * 4);
  for (let i = 0; i < 8; i++) warmLightsFlat.set(warmLights[i], i * 4);

  function bindCommonStrokeUniforms(view, proj, vpW, vpH, time, reflVP, hasRefl) {
    gl.useProgram(strokeProg);
    gl.uniformMatrix4fv(uLoc.uView, false, view);
    gl.uniformMatrix4fv(uLoc.uProj, false, proj);
    gl.uniformMatrix4fv(uLoc.uModel, false, mat4Identity());
    gl.uniform1i(uLoc.uUseModel, 0);
    gl.uniform3fv(uLoc.uCamPos, cam.pos);
    gl.uniform2f(uLoc.uViewport, vpW, vpH);
    gl.uniform1f(uLoc.uTime, time);
    gl.uniform1f(uLoc.uWaterY, WATER_Y);
    gl.uniform1i(uLoc.uIsGrass, 0);
    gl.uniform1f(uLoc.uGrassSpan, GRASS_SPAN);
    gl.uniform1f(uLoc.uTerrainWorldSpan, TERRAIN_WORLD_SPAN);
    gl.uniform3fv(uLoc.uMoonDir, MOON_DIR);
    gl.uniform3fv(uLoc.uLanternPos, player.lanternPos);
    gl.uniform4fv(uLoc.uWarmLights, warmLightsFlat);
    gl.uniformMatrix4fv(uLoc.uReflVP, false, reflVP);
    gl.uniform1i(uLoc.uHasRefl, hasRefl ? 1 : 0);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, terrainTex);
    gl.uniform1i(uLoc.uTerrainTex, 0);

    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, reflTex);
    gl.uniform1i(uLoc.uReflTex, 1);
  }

  function drawBatch(gpuObj) {
    if (gpuObj.count <= 0) return;
    gl.bindVertexArray(gpuObj.vao);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, gpuObj.count);
  }

  let lastTime = performance.now();
  let simTime = 0;
  let paused = urlParams.get('paused') === '1';
  let camOverride = null;
  let lastReflVP = mat4Identity();

  function stepSim(dt, rawDt) {
    simTime += dt;
    const time = simTime;

    if (rawDt > 0.001 && rawDt < 1.5) {
      fpsAvg = mix(fpsAvg, 1.0 / rawDt, 0.14);
    }
    frameCounter++;
    fpsCheckTimer += rawDt;
    if (fpsCheckTimer >= 1.2) {
      const targetLow = isMobile ? 30 : 42;
      const targetHigh = isMobile ? 52 : 56;
      if (fpsAvg < targetLow && renderScale > 0.50) {
        renderScale = Math.max(0.50, +(renderScale - 0.12).toFixed(2));
        resizeCanvas();
      } else if (fpsAvg > targetHigh && renderScale < 1.0) {
        renderScale = Math.min(1.0, +(renderScale + 0.08).toFixed(2));
        resizeCanvas();
      }
      statFps.textContent = `${Math.round(fpsAvg)} FPS`;
      statScale.textContent = `${Math.round(renderScale * 100)}%`;
      fpsCheckTimer = 0;
    }

    let moveX = 0, moveZ = 0, targetSpeed = 0, wantJump = false;
    let inFwd = 0, inRight = 0;
    if (keys.KeyW || keys.ArrowUp)    inFwd += 1;
    if (keys.KeyS || keys.ArrowDown)  inFwd -= 1;
    if (keys.KeyD || keys.ArrowRight) inRight += 1;
    if (keys.KeyA || keys.ArrowLeft)  inRight -= 1;

    if (Math.hypot(joyVecX, joyVecY) > 0.12) {
      inRight += joyVecX;
      inFwd   -= joyVecY;
    }

    if (autoRide) {
      const pNear = getPathInfo(player.x, player.z);
      player.pathS = pNear.s;
      const ahead = samplePathByS(player.pathS + 6.5);
      const dx = ahead.x - player.x, dz = ahead.z - player.z;
      const dl = Math.hypot(dx, dz) || 1;
      moveX = dx / dl; moveZ = dz / dl;
      targetSpeed = 8.8;

      for (const ob of obstacles) {
        let ds = ob.s - player.pathS;
        if (ds < 0) ds += totalPathLen;
        if (ds > 1.6 && ds < 5.0 && player.grounded) {
          wantJump = true;
          break;
        }
      }
    } else {
      const mag = Math.hypot(inFwd, inRight);
      if (mag > 0.05) {
        const fwdX = -Math.sin(cam.yaw), fwdZ = -Math.cos(cam.yaw);
        const rgtX =  Math.cos(cam.yaw), rgtZ = -Math.sin(cam.yaw);
        moveX = (fwdX * inFwd + rgtX * inRight) / mag;
        moveZ = (fwdZ * inFwd + rgtZ * inRight) / mag;
        const sprint = keys.ShiftLeft || keys.ShiftRight || joySprint;
        targetSpeed = sprint ? 15.2 : 8.2;
      }
      if (keys.Space || touchJumpQueued) {
        wantJump = true;
        touchJumpQueued = false;
      }
    }

    const prevVx = player.vx, prevVz = player.vz;
    stepPhysics(dt, moveX, moveZ, targetSpeed, wantJump);

    const strideRate = player.speed > 10.5 ? 10.5 : (player.speed > 0.35 ? 5.8 : 1.4);
    player.gaitPhase += dt * strideRate;

    const ax = clamp((player.vx - prevVx) / dt, -25, 25);
    const az = clamp((player.vz - prevVz) / dt, -25, 25);
    player.lanternVelX += (-18.0 * player.lanternAngleX - 3.6 * player.lanternVelX - ax * 0.032 + Math.sin(time * 2.4) * 0.25) * dt;
    player.lanternVelZ += (-18.0 * player.lanternAngleZ - 3.6 * player.lanternVelZ - az * 0.032 + Math.cos(time * 1.9) * 0.25) * dt;
    player.lanternAngleX = clamp(player.lanternAngleX + player.lanternVelX * dt, -0.6, 0.6);
    player.lanternAngleZ = clamp(player.lanternAngleZ + player.lanternVelZ * dt, -0.6, 0.6);

    if (camOverride) {
      cam.pos = camOverride.pos;
      cam.target = camOverride.target;
    } else if (tourMode) {
      tourTime += dt * 0.14;
      const N = tourWaypoints.length;
      const seg = Math.floor(tourTime) % N;
      const f = tourTime - Math.floor(tourTime);
      const w0 = tourWaypoints[(seg - 1 + N) % N];
      const w1 = tourWaypoints[seg];
      const w2 = tourWaypoints[(seg + 1) % N];
      const w3 = tourWaypoints[(seg + 2) % N];
      cam.pos = catmullRom(w0.eye, w1.eye, w2.eye, w3.eye, f);
      cam.target = catmullRom(w0.target, w1.target, w2.target, w3.target, f);
    } else {
      if (autoRide && !draggingMouse && camTouches.size === 0) {
        const desiredYaw = player.yaw + Math.PI + 0.32;
        let diff = desiredYaw - cam.yaw;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        cam.yaw += diff * clamp(dt * 1.15, 0, 1);
      }
      const focusY = player.y + 2.35;
      cam.target = [player.x, focusY, player.z];
      const horiz = Math.cos(cam.pitch) * cam.dist;
      let cx = player.x + Math.sin(cam.yaw) * horiz;
      let cz = player.z + Math.cos(cam.yaw) * horiz;
      let cy = focusY + Math.sin(cam.pitch) * cam.dist;
      const groundAtCam = getRideableHeight(cx, cz) + 0.85;
      if (cy < groundAtCam) cy = groundAtCam;
      cam.pos = [cx, cy, cz];
    }
  }

  function drawFrame() {
    const time = simTime;
    buildHeroStrokes(time);

    const windmillRotMat = mat4RotateZ(mat4Translate(mat4Identity(), WINDMILL_HUB.x, WINDMILL_HUB.y, WINDMILL_HUB.z), time * 0.65);

    // 4. Pass 0: Render River Reflection FBO (throttle slightly on very low FPS)
    const updateRefl = (frameCounter === 1) || (fpsAvg >= 28) || (frameCounter % 3 === 0) || (camOverride !== null);
    if (updateRefl) {
      const reflEye = [cam.pos[0], 2 * WATER_Y - cam.pos[1], cam.pos[2]];
      const reflTgt = [cam.target[0], 2 * WATER_Y - cam.target[1], cam.target[2]];
      const reflView = mat4LookAt(reflEye, reflTgt, [0, 1, 0]);
      const reflProj = mat4Perspective(52 * Math.PI / 180, canvas.width / canvas.height, 0.4, 1400);
      lastReflVP = mat4Mul(reflProj, reflView);

      gl.bindFramebuffer(gl.FRAMEBUFFER, reflFBO);
      gl.viewport(0, 0, REFL_W, REFL_H);
      gl.enable(gl.DEPTH_TEST);
      gl.depthFunc(gl.LESS);
      gl.clearColor(0.03, 0.08, 0.22, 1.0);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

      const savedCamPos = cam.pos;
      cam.pos = reflEye;
      drawSolidMesh(skySolidMesh, reflView, reflProj, true);
      gl.enable(gl.POLYGON_OFFSET_FILL);
      gl.polygonOffset(2.0, 4.0);
      for (const mm of mountainSolidMeshes) drawSolidMesh(mm, reflView, reflProj, false);
      gl.disable(gl.POLYGON_OFFSET_FILL);

      bindCommonStrokeUniforms(reflView, reflProj, REFL_W, REFL_H, time, lastReflVP, false);
      drawBatch(skyGPU);
      drawBatch(mtnGPU);
      drawBatch(wfGPU);
      drawBatch(heroGPU);
      gl.uniformMatrix4fv(uLoc.uModel, false, windmillRotMat);
      gl.uniform1i(uLoc.uUseModel, 1);
      drawBatch(sailsGPU);
      gl.uniform1i(uLoc.uUseModel, 0);
      cam.pos = savedCamPos;
    }

    // 5. Pass 1: Main Scene Rendering
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LESS);
    gl.clearColor(0.03, 0.08, 0.22, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    const view = mat4LookAt(cam.pos, cam.target, [0, 1, 0]);
    const proj = mat4Perspective(52 * Math.PI / 180, canvas.width / canvas.height, 0.35, 1400);

    drawSolidMesh(skySolidMesh, view, proj, true);
    gl.enable(gl.POLYGON_OFFSET_FILL);
    gl.polygonOffset(2.0, 4.0);
    for (const mm of mountainSolidMeshes) drawSolidMesh(mm, view, proj, false);
    gl.disable(gl.POLYGON_OFFSET_FILL);

    bindCommonStrokeUniforms(view, proj, canvas.width, canvas.height, time, lastReflVP, true);
    drawBatch(skyGPU);
    drawBatch(mtnGPU);
    drawBatch(worldGPU);
    drawBatch(riverGPU);
    drawBatch(wfGPU);
    drawBatch(heroGPU);

    gl.uniformMatrix4fv(uLoc.uModel, false, windmillRotMat);
    gl.uniform1i(uLoc.uUseModel, 1);
    drawBatch(sailsGPU);
    gl.uniform1i(uLoc.uUseModel, 0);

    gl.uniform1i(uLoc.uIsGrass, 1);
    drawBatch(grassGPU);
    gl.uniform1i(uLoc.uIsGrass, 0);
  }

  function renderOneFrame(dt, rawDt) {
    stepSim(dt, rawDt);
    drawFrame();
  }

  function frame(now) {
    const rawDt = (now - lastTime) * 0.001;
    lastTime = now;
    if (!paused) {
      const dt = clamp(rawDt, 0.001, 0.05);
      renderOneFrame(dt, rawDt);
    }
    requestAnimationFrame(frame);
  }

  // Expose minimal debug state for automated verification without cluttering UI
  window.__STARRY_DEBUG__ = {
    get state() {
      return {
        physicsMode,
        autoRide,
        tourMode,
        totalStrokes,
        renderScale,
        fps: Math.round(fpsAvg),
        player: { x: player.x, y: player.y, z: player.z, grounded: player.grounded, speed: player.speed, yaw: player.yaw, pathS: player.pathS },
        cam: { pos: cam.pos, target: cam.target, dist: cam.dist },
        obstacles: obstacles.map(o => ({ type: o.type, x: o.x, y: o.y, z: o.z, s: o.s })),
        bridges: bridges.map(b => ({ x: b.x, z: b.z, s: b.s }))
      };
    },
    setPaused(v) { paused = !!v; },
    stepAndRender(dt = 0.016, steps = 1, rawDtOverride = null) {
      const rdt = rawDtOverride !== null ? rawDtOverride : dt;
      for (let i = 0; i < steps; i++) stepSim(dt, rdt);
      drawFrame();
    },
    setView(eye, target) {
      tourMode = false;
      camOverride = eye ? { pos: eye, target } : null;
    },
    setTour(on) {
      camOverride = null;
      tourMode = !!on;
      btnTour.classList.toggle('active', tourMode);
      btnTour.textContent = tourMode ? '全景巡遊：開' : '全景巡遊：關';
    },
    warpNearObstacle(idx = 0) {
      const ob = obstacles[idx % obstacles.length];
      const back = samplePathByS(ob.s - 6.0);
      player.x = back.x; player.z = back.z;
      player.y = getRideableHeight(back.x, back.z);
      player.yaw = Math.atan2(back.tx, back.tz);
      player.vx = back.tx * 8.8; player.vz = back.tz * 8.8; player.vy = 0;
      player.grounded = true;
      player.pathS = back.s;
      if (rapierBody) {
        rapierBody.setTranslation({ x: player.x, y: player.y + 0.95, z: player.z }, true);
        rapierBody.setNextKinematicTranslation({ x: player.x, y: player.y + 0.95, z: player.z });
      }
    }
  };

  initPhysics().then(() => {
    setLoadProgress(100, '完成！');
    loaderOverlay.classList.add('hidden');
    setTimeout(() => { loaderOverlay.style.display = 'none'; }, 580);
    if (!paused) renderOneFrame(0.016, 0.016);
    requestAnimationFrame(frame);
  });
})();
</script>
